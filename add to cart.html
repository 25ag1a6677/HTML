<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Essentials Store</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Daily Essentials</a>

        <button class="btn btn-warning">
            🛒 Cart
            <span class="badge bg-danger" id="cart-count">0</span>
        </button>
    </div>
</nav>

<!-- Banner -->
<div class="container mt-4">
    <div class="p-5 bg-light rounded text-center shadow">
        <h1>Welcome to Daily Essentials</h1>
        <p>Fresh groceries delivered to your doorstep.</p>
    </div>
</div>

<!-- Products -->
<div class="container mt-5">
<div class="row">

<!-- Product 1 -->
<div class="col-md-3 mb-4">
<div class="card shadow">
<img src="milk..png" class="card-img-top">
<div class="card-body text-center">
<h5>Milk</h5>
<p>₹30</p>
<button class="btn btn-success"
onclick="addToCart('Milk',30)">Add to Cart</button>
</div>
</div>
</div>

</div>

<!-- Product 6 -->
<div class="col-md-3 mb-4">

<!-- Cart Section -->
<div class="container mt-5 mb-5">
<div class="card shadow">
<div class="card-header bg-success text-white">
<h3>Shopping Cart</h3>
</div>

<div class="card-body">

<ul id="cart-items" class="list-group mb-3">

</ul>

<h4>Total : ₹<span id="total">0</span></h4>

<button class="btn btn-danger mt-3" onclick="clearCart()">
Clear Cart
</button>

</div>
</div>
</div>

<script src="script.js"></script>

</html>
